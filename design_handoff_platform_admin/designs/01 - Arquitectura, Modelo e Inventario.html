document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e8f8;\n  --eminent-action:  #194d81;\n\n  --classic-primary: #fa6400;\n  --classic-dark:    #c85000;\n  --classic-light:   #ffe2ce;\n  --classic-action:  #a84308;\n\n  --move-primary: #8a50f7;\n  --move-dark:    #530adb;\n  --move-light:   #e2d2ff;\n  --move-action:  #4e19b1;\n\n  --wine-primary: #a34b67;\n  --wine-dark:    #5d2b3b;\n  --wine-light:   #d9aebc;\n  --wine-action:  #5d2b3b;\n\n  --prefer-primary: #7f6d48;\n  --prefer-dark:    #504730;\n  --prefer-light:   #e2ddcf;\n\n  /* ---- Neutrals (grey scale) ---- */\n  --white:   #ffffff;\n  --black:   #000000;\n  --grey-20: #f4f4f4; /* page / subtle fill */\n  --grey-30: #e8e8e9;\n  --grey-40: #bebebe; /* borders, disabled fill */\n  --grey-50: #c1c1c2;\n  --grey-60: #6a6a6a; /* secondary text */\n  --grey-80: #2b2b2b; /* primary text, icon fill */\n  --darker:  #171a1f; /* near-black surfaces */\n\n  /* ---- State colors ---- */\n  --state-error:   #c51111;\n  --state-success: #258825;\n  --state-warning: #e99d09;\n  --state-info:    #2970bc;\n  --link:          #0e7bc4;\n\n  --state-error-light:   #f8d8d8;\n  --state-success-light: #d3e7d3;\n  --state-warning-light: #fde6a3;\n  --state-info-light:    #c5dbf2;\n\n  /* ---- Overlays / scrims ---- */\n  --overlay-screen: rgba(23, 25, 31, 0.12);\n  --overlay-light:  rgba(23, 25, 31, 0.40);\n  --overlay-dark:   rgba(23, 25, 31, 0.60);\n  --overlay-modal:  rgba(43, 43, 43, 0.60);\n\n  /* ---- White alphas (use over imagery / colored surfaces) ---- */\n  --white-70:    rgba(255, 255, 255, 0.70);\n  --white-80:    rgba(255, 255, 255, 0.80);\n  --white-a64:   rgba(255, 255, 255, 0.64);\n  --white-a16:   rgba(255, 255, 255, 0.16);\n  --white-a12:   rgba(255, 255, 255, 0.12);\n  --white-a08:   rgba(255, 255, 255, 0.08);\n\n  /* ============================================================\n     Semantic aliases — author UI against these, not raw values.\n     ============================================================ */\n  --text-strong:    var(--grey-80);\n  --text-body:      var(--grey-80);\n  --text-secondary: var(--grey-60);\n  --text-disabled:  var(--grey-40);\n  --text-on-brand:  var(--white);\n  --text-link:      var(--link);\n\n  --surface-page:   var(--grey-20);\n  --surface-card:   var(--white);\n  --surface-sunken: var(--grey-20);\n  --surface-inverse: var(--darker);\n\n  --border-subtle:  var(--grey-30);\n  --border-default: var(--grey-40);\n  --border-strong:  var(--grey-80);\n\n  --icon-default:   var(--grey-80);\n  --icon-muted:     var(--grey-60);\n  --icon-brand:     var(--brand-primary);\n}\n\n/* ============================================================\n   Theme scopes — set data-theme on any container to re-brand the\n   --brand-* family. Components read --brand-* only.\n   ============================================================ */\n[data-theme=\"eminent\"] {\n  --brand-primary: var(--eminent-primary);\n  --brand-dark:    var(--eminent-dark);\n  --brand-light:   var(--eminent-light);\n  --brand-action:  var(--eminent-action);\n}\n[data-theme=\"classic\"] {\n  --brand-primary: var(--classic-primary);\n  --brand-dark:    var(--classic-dark);\n  --brand-light:   var(--classic-light);\n  --brand-action:  var(--classic-action);\n}\n[data-theme=\"move\"] {\n  --brand-primary: var(--move-primary);\n  --brand-dark:    var(--move-dark);\n  --brand-light:   var(--move-light);\n  --brand-action:  var(--move-action);\n}\n[data-theme=\"wine\"] {\n  --brand-primary: var(--wine-primary);\n  --brand-dark:    var(--wine-dark);\n  --brand-light:   var(--wine-light);\n  --brand-action:  var(--wine-action);\n}\n[data-theme=\"prefer\"] {\n  --brand-primary: var(--prefer-primary);\n  --brand-dark:    var(--prefer-dark);\n  --brand-light:   var(--prefer-light);\n  --brand-action:  var(--prefer-dark);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   BRICK · Categorical / data-viz palette\n   From @brick/brand (colors-ui.ts). Used for charts, chips,\n   category tags and IconState  #7374b9; --lavender-50: #5354a6;\n  --lavender-60: #424384; --lavender-70: #313262;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   BRICK · Typography tokens\n   From @brick/brand (theme/fonts.ts). Brick uses a numbered scale\n   (s1–s8 + overline) for editorial text and a named GUI scale\n   (title-*, number-*, text-*) for product surfaces.\n   Weight note: Brick calls 500 \"Semibold\" and uses it as its bold.\n   ============================================================ */\n\n:root {\n  /* ---- Font sizes ---- */\n  --fs-10: 10px;\n  --fs-12: 12px;\n  --fs-14: 14px;\n  --fs-16: 16px;\n  --fs-18: 18px;\n  --fs-20: 20px;\n  --fs-24: 24px;\n  --fs-28: 28px;\n  --fs-30: 30px;\n  --fs-32: 32px;\n  --fs-48: 48px;\n  --fs-64: 64px;\n  --fs-96: 96px;\n\n  /* ---- Weights ---- */\n  --fw-light:    300; /* @kind font */\n  --fw-regular:  400; /* @kind font */\n  --fw-semibold: 500; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* ---- Line heights (absolute, as defined in brand) ---- */\n  --lh-16: 16px;  --lh-18: 18px;  --lh-20: 20px;  --lh-22: 22px;\n  --lh-24: 24px;  --lh-26: 26px;  --lh-28: 28px;  --lh-36: 36px;\n  --lh-48: 48px;  --lh-56: 56px;  --lh-72: 72px;\n\n  /* ---- Letter spacing (display sizes tighten) ---- */\n  --ls-tightest: -1.35px; /* s1 / 30px */\n  --ls-tighter:  -1.08px; /* s2 / 24px */\n  --ls-tight:    -0.6px;\n  --ls-normal:   0px;\n  --ls-wide:     0.16px;\n  --ls-overline: 0.98px;  /* overline, uppercase */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   BRICK · Spacing\n   From @brick/brand (theme/spacing.ts). 4px base grid.\n   Layout horizontal padding is 24px.\n   ============================================================ */\n\n:root {\n  --space-4:  4px;\n  --space-8:  8px;\n  --space-12: 12px;\n  --space-16: 16px;\n  --space-24: 24px;\n  --space-32: 32px;\n  --space-40: 40px;\n  --space-48: 48px;\n  --space-96: 96px;\n\n  --layout-padding-x: 24px;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   BRICK · Effects — radii, elevation, motion, z-index, breakpoints\n   From @brick/brand (themes.ts base, token/Shadow.ts).\n   ============================================================ */\n\n:root {\n  /* ---- Corner radii (Brick is restrained: 4 & 8 only) ---- */\n  --radius-4: 4px;\n  --radius-8: 8px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* ---- Elevation (4-step shadow token scale) ---- */\n  --shadow-1: 0px 2px 4px 1px rgba(231, 231, 231, 0.5);\n  --shadow-2: 0px 2px 2px rgba(0, 0, 0, 0.14), 0px 1px 8px rgba(0, 0, 0, 0.12);\n  --shadow-3: 0px 3px 5px -1px rgba(0, 0, 0, 0.2), 0px 6px 10px rgba(0, 0, 0, 0.14), 0px 1px 18px rgba(0, 0, 0, 0.12);\n  --shadow-4: 0px 4px 5px rgba(0, 0, 0, 0.14), 0px 1px 10px rgba(0, 0, 0, 0.12), 0px 2px 4px rgba(0, 0, 0, 0.2);\n  --shadow-modal: 0px 2px 1px -1px rgba(0, 0, 0, 0.2), 0px 1px 1px rgba(0, 0, 0, 0.14), 0px 1px 3px rgba(0, 0, 0, 0.12);\n\n  /* ---- Motion ---- */\n  --motion-fast:  150ms ease-in-out; /* @kind other */\n  --motion-base:  170ms ease-in-out; /* @kind other */\n  --motion-slow:  200ms ease-in-out; /* @kind other */\n  --motion-enter: 350ms ease-out; /* @kind other */\n  --ease-standard: ease-in-out; /* @kind other */\n  --ease-enter: ease-out; /* @kind other */\n\n  /* ---- Z-index ladder ---- */\n  --z-dropdown: 1; /* @kind other */\n  --z-topbar:   2; /* @kind other */\n  --z-drawer:   3; /* @kind other */\n  --z-modal:    4; /* @kind other */\n\n  /* ---- Breakpoints (reference values) ---- */\n  --bp-xs: 359px; /* @kind other */\n  --bp-sm: 767px; /* @kind other */\n  --bp-md: 1023px; /* @kind other */\n  --bp-lg: 1279px; /* @kind other */\n  --bp-xl: 1500px; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   BRICK · Base layer — reset + typography utility classes\n   Ships the s1–s8 editorial scale and the GUI named scale as\n   ready-to-use classes. Pair with --font-default / --font-bold.\n   ============================================================ */\n\n*,\n*::before,\n*::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-default);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ---- Editorial scale (headings/body share these) ---- */\n.brk-s1 { font: var(--fw-semibold) var(--fs-30)/var(--lh-36) var(--font-bold); letter-spacing: var(--ls-tightest); }\n.brk-s2 { font: var(--fw-semibold) var(--fs-24)/var(--lh-26) var(--font-bold); letter-spacing: var(--ls-tighter); }\n.brk-s3 { font: var(--fw-semibold) var(--fs-20)/var(--lh-24) var(--font-bold); letter-spacing: var(--ls-normal); }\n.brk-s4 { font: var(--fw-regular)  var(--fs-18)/var(--lh-22) var(--font-default); letter-spacing: var(--ls-normal); }\n.brk-s5 { font: var(--fw-regular)  var(--fs-16)/var(--lh-22) var(--font-default); letter-spacing: var(--ls-wide); }\n.brk-s6 { font: var(--fw-semibold) var(--fs-16)/var(--lh-22) var(--font-bold); letter-spacing: -0.01em; }\n.brk-s7 { font: var(--fw-regular)  var(--fs-14)/var(--lh-20) var(--font-default); letter-spacing: 0.14px; }\n.brk-s8 { font: var(--fw-regular)  var(--fs-12)/var(--lh-18) var(--font-default); letter-spacing: var(--ls-normal); }\n.brk-overline {\n  font: var(--fw-semibold) var(--fs-14)/var(--lh-16) var(--font-bold);\n  letter-spacing: var(--ls-overline);\n  text-transform: uppercase;\n}\n\n/* ---- GUI named scale (product surfaces) ---- */\n.brk-title-jumbo   { font: var(--fw-semibold) var(--fs-48)/var(--lh-56) var(--font-bold); }\n.brk-title-section { font: var(--fw-semibold) var(--fs-32)/var(--lh-48) var(--font-bold); }\n.brk-title-big     { font: var(--fw-semibold) var(--fs-24)/var(--lh-36) var(--font-bold); }\n.brk-title-medium  { font: var(--fw-semibold) var(--fs-20)/var(--lh-26) var(--font-bold); }\n.brk-title-sm \n\n/* ============================================================\n   BRICK · Color tokens\n   Sourced from @brick/brand (theme/colors.ts, colors-ui.ts, themes.ts)\n   Brick is multi-theme. \"classic\" (orange) is Brick's own brand\n   accent; product themes (eminent/move/wine/prefer) re-map --brand-*.\n   ============================================================ */\n\n:root {\n  /* ---- Brand accent (default = classic / orange, the Brick mark) ---- */\n  --brand-primary: #fa6400;\n  --brand-dark:    #c85000;\n  --brand-light:   #ffe2ce;\n  --brand-action:  #a84308; /* pressed / high-contrast text on light */\n\n  /* ---- Product theme palettes (swap onto --brand-* per surface) ---- */\n  --eminent-primary: #003973;\n  --eminent-dark:    #002041;\n  --eminent-light:   #d8e8f8;\n  --eminent-action:  #194d81;\n\n  --classic-primary: #fa6400;\n  --classic-dark:    #c85000;\n  --classic-light:   #ffe2ce;\n  --classic-action:  #a84308;\n\n  --move-primary: #8a50f7;\n  --move-dark:    #530adb;\n  --move-light:   #e2d2ff;\n  --move-action:  #4e19b1;\n\n  --wine-primary: #a34b67;\n  --wine-dark:    #5d2b3b;\n  --wine-light:   #d9aebc;\n  --wine-action:  #5d2b3b;\n\n  --prefer-primary: #7f6d48;\n  --prefer-dark:    #504730;\n  --prefer-light:   #e2ddcf;\n\n  /* ---- Neutrals (grey scale) ---- */\n  --white:   #ffffff;\n  --black:   #000000;\n  --grey-20: #f4f4f4; /* page / subtle fill */\n  --grey-30: #e8e8e9;\n  --grey-40: #bebebe; /* borders, disabled fill */\n  --grey-50: #c1c1c2;\n  --grey-60: #6a6a6a; /* secondary text */\n  --grey-80: #2b2b2b; /* primary text, icon fill */\n  --darker:  #171a1f; /* near-black surfaces */\n\n  /* ---- State colors ---- */\n  --state-error:   #c51111;\n  --state-success: #258825;\n  --state-warning: #e99d09;\n  --state-info:    #2970bc;\n  --link:          #0e7bc4;\n\n  --state-error-light:   #f8d8d8;\n  --state-success-light: #d3e7d3;\n  --state-warning-light: #fde6a3;\n  --state-info-light:    #c5dbf2;\n\n  /* ---- Overlays / scrims ---- */\n  --overlay-screen: rgba(23, 25, 31, 0.12);\n  --overlay-light:  rgba(23, 25, 31, 0.40);\n  --overlay-dark:   rgba(23, 25, 31, 0.60);\n  --overlay-modal:  rgba(43, 43, 43, 0.60);\n\n  /* ---- White alphas (use over imagery / colored surfaces) ---- */\n  --white-70:    rgba(255, 255, 255, 0.70);\n  --white-80:    rgba(255, 255, 255, 0.80);\n  --white-a64:   rgba(255, 255, 255, 0.64);\n  --white-a16:   rgba(255, 255, 255, 0.16);\n  --white-a12:   rgba(255, 255, 255, 0.12);\n  --white-a08:   rgba(255, 255, 255, 0.08);\n\n  /* ============================================================\n     Semantic aliases — author UI against these, not raw values.\n     ============================================================ */\n  --text-strong:    var(--grey-80);\n  --text-body:      var(--grey-80);\n  --text-secondary: var(--grey-60);\n  --text-disabled:  var(--grey-40);\n  --text-on-brand:  var(--white);\n  --text-link:      var(--link);\n\n  --surface-page:   var(--grey-20);\n  --surface-card:   var(--white);\n  --surface-sunken: var(--grey-20);\n  --surface-inverse: var(--darker);\n\n  --border-subtle:  var(--grey-30);\n  --border-default: var(--grey-40);\n  --border-strong:  var(--grey-80);\n\n  --icon-default:   var(--grey-80);\n  --icon-muted:     var(--grey-60);\n  --icon-brand:     var(--brand-primary);\n}\n\n/* ============================================================\n   Theme scopes — set data-theme on any container to re-brand the\n   --brand-* family. Components read --brand-* only.\n   ============================================================ */\n[data-theme=\"eminent\"] {\n  --brand-primary: var(--eminent-primary);\n  --brand-dark:    var(--eminent-dark);\n  --brand-light:   var(--eminent-light);\n  --brand-action:  var(--eminent-action);\n}\n[data-theme=\"classic\"] {\n  --brand-primary: var(--classic-primary);\n  --brand-dark:    var(--classic-dark);\n  --brand-light:   var(--classic-light);\n  --brand-action:  var(--classic-action);\n}\n[data-theme=\"move\"] {\n  --brand-primary: var(--move-primary);\n  --brand-dark:    var(--move-dark);\n  --brand-light:   var(--move-light);\n  --brand-action:  var(--move-action);\n}\n[data-theme=\"wine\"] {\n  --brand-primary: var(--wine-primary);\n  --brand-dark:    var(--wine-dark);\n  --brand-light:   var(--wine-light);\n  --brand-action:  var(--wine-action);\n}\n[data-theme=\"prefer\"] {\n  --brand-primary: var(--prefer-primary);\n  --brand-dark:    var(--prefer-dark);\n  --brand-light:   var(--prefer-light);\n  --brand-action:  var(--prefer-dark);\n}\n\n/* ============================================================\n   BRICK · Categorical / data-viz palette\n   From @brick/brand (colors-ui.ts). Used for charts, chips,\n   category tags and IconState badges. Each hue ships 2-6 steps;\n   the mid step (≈50/60) is the canonical \"solid\" value.\n   ============================================================ */\n\n:root {\n  --yellow-30: #fdecbf;  --yellow-40: #fcde8d;  --yellow-50: #fad05c;\n  --yellow-60: #efc13d;  --yellow-70: #e6af13;  --yellow-80: #af861e;\n\n  --green-20: #bae8c4;   --green-40: #94dba3;   --green-45: #81d593;\n  --green-50: #6ece82;   --green-60: #48c161;   --green-70: #36a04c;\n\n  --grass-40: #92b828;   --grass-50: #718e1f;   --grass-60: #506416;\n\n  --forest-20: #a6d5a6;  --forest-40: #84c484;  --forest-50: #62b362;\n  --forest-60: #4a984a;  --forest-70: #397639;\n\n  --blue-20: #c5dbf2;    --blue-30: #9bc1e9;    --blue-40: #71a7e0;\n  --blue-50: #478dd7;    --blue-60: #2a73c1;    --blue-70: #215a97;\n\n  --sky-30: #dde4ee;     --sky-40: #bbc8dd;     --sky-50: #99adcc;\n  --sky-60: #7792bb;     --sky-70: #5577aa;     --sky-75: #4d6b99;\n\n  --ocean-20: #9ad2d1;   --ocean-40: #53b3b1;   --ocean-50: #419291;\n  --ocean-60: #316f6e;   --ocean-70: #224b4b;\n\n  --electric-20: #acbfff; --electric-40: #7998ff; --electric-50: #4671ff;\n  --electric-60: #134aff;  --electric-70: #0034df;\n\n  --pink-20: #e6b1bb;    --pink-40: #da8a9a;    --pink-50: #ce6378;\n  --pink-60: #c13d57;    --pink-70: #9a3146;\n\n  --wine-20: #d9aebc;    --wine-40: #b96882;    --wine-50: #a34b67;\n  --wine-60: #803b51;    --wine-70: #5d2b3b;\n\n  --salmon-50: #ff797b;\n\n  --orange-20: #ffe2ce;  --orange-40: #fa6400;  --orange-50: #fa6400;\n  --orange-55: #c85000;  --orange-60: #c85000;\n\n  --brown-20: #cea99c;   --brown-40: #ac6e58;   --brown-50: #8c5845;\n  --brown-60: #6a4334;   --brown-70: #482d23;\n\n  --red-20: #fcdfdf;     --red-30: #fac8c8;     --red-40: #f69999;\n  --red-50: #f26a6a;     --red-55: #f05353;     --red-60: #ee3b3b;  --red-70: #e21414;\n\n  --purple-20: #f0e8f5;  --purple-40: #c39fd8;  --purple-50: #ac7bc9;\n  --purple-60: #9557ba;  --purple-70: #7b409e;\n\n  --lavender-20: #b7b8db; --lavender-40: #7374b9; --lavender-50: #5354a6;\n  --lavender-60: #424384; --lavender-70: #313262;\n}\n\n/* ============================================================\n   BRICK · Typography tokens\n   From @brick/brand (theme/fonts.ts). Brick uses a numbered scale\n   (s1–s8 + overline) for editorial text and a named GUI scale\n   (title-*, number-*, text-*) for product surfaces.\n   Weight note: Brick calls 500 \"Semibold\" and uses it as its bold.\n   ============================================================ */\n\n:root {\n  /* ---- Font sizes ---- */\n  --fs-10: 10px;\n  --fs-12: 12px;\n  --fs-14: 14px;\n  --fs-16: 16px;\n  --fs-18: 18px;\n  --fs-20: 20px;\n  --fs-24: 24px;\n  --fs-28: 28px;\n  --fs-30: 30px;\n  --fs-32: 32px;\n  --fs-48: 48px;\n  --fs-64: 64px;\n  --fs-96: 96px;\n\n  /* ---- Weights ---- */\n  --fw-light:    300; /* @kind font */\n  --fw-regular:  400; /* @kind font */\n  --fw-semibold: 500; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* ---- Line heights (absolute, as defined in brand) ---- */\n  --lh-16: 16px;  --lh-18: 18px;  --lh-20: 20px;  --lh-22: 22px;\n  --lh-24: 24px;  --lh-26: 26px;  --lh-28: 28px;  --lh-36: 36px;\n  --lh-48: 48px;  --lh-56: 56px;  --lh-72: 72px;\n\n  /* ---- Letter spacing (display sizes tighten) ---- */\n  --ls-tightest: -1.35px; /* s1 / 30px */\n  --ls-tighter:  -1.08px; /* s2 / 24px */\n  --ls-tight:    -0.6px;\n  --ls-normal:   0px;\n  --ls-wide:     0.16px;\n  --ls-overline: 0.98px;  /* overline, uppercase */\n}\n\n/* ============================================================\n   BRICK · Spacing\n   From @brick/brand (theme/spacing.ts). 4px base grid.\n   Layout horizontal padding is 24px.\n   ============================================================ */\n\n:root {\n  --space-4:  4px;\n  --space-8:  8px;\n  --space-12: 12px;\n  --space-16: 16px;\n  --space-24: 24px;\n  --space-32: 32px;\n  --space-40: 40px;\n  --space-48: 48px;\n  --space-96: 96px;\n\n  --layout-padding-x: 24px;\n}\n\n/* ============================================================\n   BRICK · Effects — radii, elevation, motion, z-index, breakpoints\n   From @brick/brand (themes.ts base, token/Shadow.ts).\n   ============================================================ */\n\n:root {\n  /* ---- Corner radii (Brick is restrained: 4 & 8 only) ---- */\n  --radius-4: 4px;\n  --radius-8: 8px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* ---- Elevation (4-step shadow token scale) ---- */\n  --shadow-1: 0px 2px 4px 1px rgba(231, 231, 231, 0.5);\n  --shadow-2: 0px 2px 2px rgba(0, 0, 0, 0.14), 0px 1px 8px rgba(0, 0, 0, 0.12);\n  --shadow-3: 0px 3px 5px -1px rgba(0, 0, 0, 0.2), 0px 6px 10px rgba(0, 0, 0, 0.14), 0px 1px 18px rgba(0, 0, 0, 0.12);\n  --shadow-4: 0px 4px 5px rgba(0, 0, 0, 0.14), 0px 1px 10px rgba(0, 0, 0, 0.12), 0px 2px 4px rgba(0, 0, 0, 0.2);\n  --shadow-modal: 0px 2px 1px -1px rgba(0, 0, 0, 0.2), 0px 1px 1px rgba(0, 0, 0, 0.14), 0px 1px 3px rgba(0, 0, 0, 0.12);\n\n  /* ---- Motion ---- */\n  --motion-fast:  150ms ease-in-out; /* @kind other */\n  --motion-base:  170ms ease-in-out; /* @kind other */\n  --motion-slow:  200ms ease-in-out; /* @kind other */\n  --motion-enter: 350ms ease-out; /* @kind other */\n  --ease-standard: ease-in-out; /* @kind other */\n  --ease-enter: ease-out; /* @kind other */\n\n  /* ---- Z-index ladder ---- */\n  --z-dropdown: 1; /* @kind other */\n  --z-topbar:   2; /* @kind other */\n  --z-drawer:   3; /* @kind other */\n  --z-modal:    4; /* @kind other */\n\n  /* ---- Breakpoints (reference values) ---- */\n  --bp-xs: 359px; /* @kind other */\n  --bp-sm: 767px; /* @kind other */\n  --bp-md: 1023px; /* @kind other */\n  --bp-lg: 1279px; /* @kind other */\n  --bp-xl: 1500px; /* @kind other */\n}\n\n/* ============================================================\n   BRICK · Base layer — reset + typography utility classes\n   Ships the s1–s8 editorial scale and the GUI named scale as\n   ready-to-use classes. Pair with --font-default / --font-bold.\n   ============================================================ */\n\n*,\n*::before,\n*::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-default);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ---- Editorial scale (headings/body share these) ---- */\n.brk-s1 { font: var(--fw-semibold) var(--fs-30)/var(--lh-36) var(--font-bold); letter-spacing: var(--ls-tightest); }\n.brk-s2 { font: var(--fw-semibold) var(--fs-24)/var(--lh-26) var(--font-bold); letter-spacing: var(--ls-tighter); }\n.brk-s3 { font: var(--fw-semibold) var(--fs-20)/var(--lh-24) var(--font-bold); letter-spacing: var(--ls-normal); }\n.brk-s4 { font: var(--fw-regular)  var(--fs-18)/var(--lh-22) var(--font-default); letter-spacing: var(--ls-normal); }\n.brk-s5 { font: var(--fw-regular)  var(--fs-16)/var(--lh-22) var(--font-default); letter-spacing: var(--ls-wide); }\n.brk-s6 { font: var(--fw-semibold) var(--fs-16)/var(--lh-22) var(--font-bold); letter-spacing: -0.01em; }\n.brk-s7 { font: var(--fw-regular)  var(--fs-14)/var(--lh-20) var(--font-default); letter-spacing: 0.14px; }\n.brk-s8 { font: var(--fw-regular)  var(--fs-12)/var(--lh-18) var(--font-default); letter-spacing: var(--ls-normal); }\n.brk-overline {\n  font: var(--fw-semibold) var(--fs-14)/var(--lh-16) var(--font-bold);\n  letter-spacing: var(--ls-overline);\n  text-transform: uppercase;\n}\n\n/* ---- GUI named scale (product surfaces) ---- */\n.brk-title-jumbo   { font: var(--fw-semibold) var(--fs-48)/var(--lh-56) var(--font-bold); }\n.brk-title-section { font: var(--fw-semibold) var(--fs-32)/var(--lh-48) var(--font-bold); }\n.brk-title-big     { font: var(--fw-semibold) var(--fs-24)/var(--lh-36) var(--font-bold); }\n.brk-title-medium  { font: var(--fw-semibold) var(--fs-20)/var(--lh-26) var(--font-bold); }\n.brk-title-small   { font: var(--fw-semibold) var(--fs-16)/var(--lh-26) var(--font-bold); }\n.brk-title-micro   { font: var(--fw-semibold) var(--fs-14)/var(--lh-24) var(--font-bold); }\n.brk-text-body     { font: var(--fw-regular)  var(--fs-14)/var(--lh-24) var(--font-default); }\n.brk-text-label    { font: var(--fw-regular)  var(--fs-12)/var(--lh-20) var(--font-default); }\n\n/* ---- Number scale (amounts, balances) ---- */\n.brk-number-jumbo  { font: var(--fw-semibold) var(--fs-64)/var(--lh-72) var(--font-bold); }\n.brk-number-big    { font: var(--fw-semibold) var(--fs-48)/var(--lh-56) var(--font-bold); }\n.brk-number-medium { font: var(--fw-semibold) var(--fs-20)/var(--lh-24) var(--font-bold); }\n.brk-number-small  { font: var(--fw-semibold) var(--fs-16)/var(--lh-26) var(--font-bold); }\n\n<\u002Fstyle>\n  <script src=\"8cccd30d-6712-4c7b-8742-1e65ddbcc663\"><\u002Fscript>\n  <style>\n    :root { --fs-11: 11px; --fs-13: 13px; --fs-15: 15px; }\n    body { margin: 0; background: var(--surface-page); color: var(--text-body); font-family: var(--font-default), Inter, sans-serif; }\n    a { color: var(--text-link); text-decoration: none; }\n    a:hover { color: var(--brand-action); text-decoration: underline; }\n    ::selection { background: var(--brand-light); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-theme=\"eminent\" style=\"min-height:100vh;background:var(--surface-page);padding:0 0 96px\">\n\n  <div style=\"background:var(--eminent-primary);color:var(--white);padding:32px 24px 28px\">\n    <div style=\"max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:var(--fw-semibold) var(--fs-12)/16px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--white-a64)\">Platform Admin / Pack Studio · Fases 1, 2 y 3 · entrada de W1-PLT-01 → W7-PLT-03<\u002Fspan>\n      <h1 style=\"margin:0;font:var(--fw-semibold) var(--fs-32)/40px var(--font-bold);letter-spacing:var(--ls-tight);max-width:26ch\">Arquitectura de información, modelo de configuración e inventario de pantallas<\u002Fh1>\n      <p style=\"margin:0;max-width:80ch;font:var(--fw-regular) var(--fs-16)/26px var(--font-default);color:var(--white-80);text-wrap:pretty\">El backoffice interno que configura, versiona, valida, publica, pilotea y audita cómo se comporta el CRM. No opera inmobiliarias ni toca sus datos. Todo lo que sigue está contrastado contra README.md §4.5, §10.2, §11, §14, §16, §24 y §42, ARCHITECTURE.md §4, §5, §12 y las tasks PLT. Lo que el dominio no define está marcado como <strong style=\"color:var(--white)\">supuesto de diseño<\u002Fstrong>.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;row-gap:6px;gap:8px;margin-top:4px\">\n        <sc-for list=\"{{ heroStats }}\" as=\"st\" hint-placeholder-count=\"4\">\n          <div style=\"background:var(--white-a12);border:1px solid var(--white-a16);border-radius:var(--radius-8);padding:10px 14px;min-width:132px\">\n            <div style=\"font:var(--fw-semibold) var(--fs-24)/28px var(--font-bold);letter-spacing:var(--ls-tight)\">{{ st.v }}<\u002Fdiv>\n            <div style=\"font:var(--fw-regular) var(--fs-12)/16px var(--font-default);color:var(--white-a64);margin-top:2px\">{{ st.k }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1360px;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;row-gap:6px;gap:24px;align-items:flex-start\">\n\n    <nav style=\"flex:0 0 232px;position:sticky;top:24px;display:flex;flex-direction:column;gap:2px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-8);box-shadow:var(--shadow-1);padding:12px\">\n      <span style=\"font:var(--fw-semibold) var(--fs-10)/16px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary);padding:6px 10px\">Contenido<\u002Fspan>\n      <sc-for list=\"{{ toc }}\" as=\"t\" hint-placeholder-count=\"9\">\n        <a href=\"{{ t.href }}\" style=\"display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:var(--radius-4);font:var(--fw-regular) var(--fs-14)/20px var(--font-default);color:var(--text-body);text-decoration:none\" style-hover=\"background:var(--grey-20);color:var(--brand-action)\">\n          <span>{{ t.label }}<\u002Fspan>\n          <span style=\"color:var(--text-secondary);font-size:var(--fs-12)\">{{ t.n }}<\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <main style=\"flex:1 1 680px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n\n      <!-- 00 · HALLAZGOS -->\n      <section id=\"hallazgos\" style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-8);box-shadow:var(--shadow-1);padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font:var(--fw-semibold) var(--fs-10)/16px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary)\">00 · Lo que el repositorio corrige del brief<\u002Fspan>\n          <h2 style=\"margin:0;font:var(--fw-semibold) var(--fs-24)/32px var(--font-bold);letter-spacing:var(--ls-tighter);color:var(--text-strong)\">Nueve hallazgos que cambian el diseño<\u002Fh2>\n        <\u002Fdiv>\n        <x-import component-from-global-scope=\"BrickDesignSystem_6e25e4.Alert\" variant=\"warning\" title=\"No hay «un» Argentina Real Estate Pack\" hint-size=\"100%,auto\">README §4.5 define <strong>cinco packs iniciales<\u002Fstrong>: Argentina Base, Argentina Compliance, Argentina Closing, Commission y Automation Starter. Y el principio es explícito: «no construir un mega Config Service»; cada bounded context sigue siendo dueño de su semántica y el <strong>PackManifest coordina versiones<\u002Fstrong> de plantillas ajenas. La UX del Pack es una <strong>composición de referencias versionadas<\u002Fstrong>, no un contenedor que edita todo adentro.<\u002Fx-import>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px\">\n          <sc-for list=\"{{ findings }}\" as=\"f\" hint-placeholder-count=\"8\">\n            <div style=\"border:1px solid var(--border-subtle);border-radius:var(--radius-4);padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface-page)\">\n              <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n                <span style=\"font:var(--fw-semibold) var(--fs-11)/15px var(--font-bold);color:var(--eminent-primary);background:var(--eminent-light);border-radius:var(--radius-4);padding:2px 7px\">{{ f.src }}<\u002Fspan>\n                <span style=\"font:var(--fw-semibold) var(--fs-14)/20px var(--font-bold);color:var(--text-strong)\">{{ f.t }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:0;font:var(--fw-regular) var(--fs-13)/19px var(--font-default);color:var(--text-body);text-wrap:pretty\">{{ f.d }}<\u002Fp>\n              <span style=\"font:var(--fw-regular) var(--fs-12)/17px var(--font-default);color:var(--state-info)\">→ {{ f.ux }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 01 · PRINCIPIO -->\n      <section id=\"principio\" style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-8);box-shadow:var(--shadow-1);padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font:var(--fw-semibold) var(--fs-10)/16px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary)\">01 · Fase 1 · Principio y verbos<\u002Fspan>\n          <h2 style=\"margin:0;font:var(--fw-semibold) var(--fs-24)/32px var(--font-bold);letter-spacing:var(--ls-tighter);color:var(--text-strong)\">Author → Validate → Release → Explain<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;max-width:80ch;font:var(--fw-regular) var(--fs-14)/22px var(--font-default);color:var(--text-body);text-wrap:pretty\">Toda la aplicación se organiza alrededor de cuatro verbos, no de 25 CRUDs. Cada artefacto configurable pasa por el mismo ciclo y usa el mismo patrón de pantalla. El menú se agrupa por tarea de plataforma, no por microservicio.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px\">\n          <sc-for list=\"{{ verbs }}\" as=\"v\" hint-placeholder-count=\"4\">\n            <div style=\"border-top:3px solid {{ v.color }};background:var(--surface-page);border-radius:0 0 var(--radius-4) var(--radius-4);padding:14px;display:flex;flex-direction:column;gap:6px\">\n              <span style=\"font:var(--fw-semibold) var(--fs-16)/22px var(--font-bold);color:var(--text-strong)\">{{ v.t }}<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-12)/18px var(--font-default);color:var(--text-body)\">{{ v.d }}<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary)\">{{ v.screens }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--border-subtle);border-radius:var(--radius-4);padding:14px;display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font:var(--fw-semibold) var(--fs-12)/17px var(--font-bold);color:var(--text-strong)\">Lo que Platform Admin NO es, y cómo lo hace visible la UI<\u002Fspan>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px\">\n            <sc-for list=\"{{ nots }}\" as=\"n\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;gap:8px;align-items:flex-start\">\n                <span style=\"flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:var(--state-error-light);color:var(--state-error);display:flex;align-items:center;justify-content:center;font:var(--fw-bold) var(--fs-11)/1 var(--font-bold)\">✕<\u002Fspan>\n                <span style=\"font:var(--fw-regular) var(--fs-13)/19px var(--font-default);color:var(--text-body)\"><strong style=\"color:var(--text-strong)\">{{ n.k }}<\u002Fstrong> — {{ n.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 02 · SITEMAP -->\n      <section id=\"sitemap\" style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-8);box-shadow:var(--shadow-1);padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font:var(--fw-semibold) var(--fs-10)/16px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary)\">02 · Fase 1 · Sitemap y modelo de navegación<\u002Fspan>\n          <h2 style=\"margin:0;font:var(--fw-semibold) var(--fs-24)/32px var(--font-bold);letter-spacing:var(--ls-tighter);color:var(--text-strong)\">Siete grupos, un shell<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;max-width:80ch;font:var(--fw-regular) var(--fs-14)/22px var(--font-default);color:var(--text-body);text-wrap:pretty\">La hipótesis del brief se sostiene contra el dominio con dos ajustes: <strong>Checklists no es un módulo<\u002Fstrong> (README §10.2 los define dentro del WorkflowTemplate, como tasks con dependencias) y <strong>Tenants se renombra Diagnóstico<\u002Fstrong> para que nadie lo lea como «administrar inmobiliarias».<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px\">\n          <sc-for list=\"{{ sitemap }}\" as=\"g\" hint-placeholder-count=\"7\">\n            <div style=\"border:1px solid var(--border-subtle);border-radius:var(--radius-4);overflow:hidden;display:flex;flex-direction:column\">\n              <div style=\"padding:10px 12px;background:var(--eminent-dark);color:var(--white);display:flex;justify-content:space-between;gap:8px;align-items:center\">\n                <span style=\"font:var(--fw-semibold) var(--fs-13)/18px var(--font-bold)\">{{ g.t }}<\u002Fspan>\n                <span style=\"font:var(--fw-regular) var(--fs-10)/14px var(--font-default);color:var(--white-a64)\">{{ g.verb }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"3\">\n                <div style=\"padding:8px 12px;border-top:1px solid var(--border-subtle);display:flex;justify-content:space-between;gap:8px;font:var(--fw-regular) var(--fs-13)/18px var(--font-default);color:var(--text-body)\">\n                  <span>{{ i.n }}<\u002Fspan>\n                  <span style=\"color:var(--text-secondary);font-size:var(--fs-11);white-space:nowrap\">{{ i.ids }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:8px 12px;border-top:1px solid var(--border-subtle);background:var(--grey-20);font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary)\">{{ g.owner }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px\">\n          <div style=\"border:1px solid var(--border-subtle);border-radius:var(--radius-4);padding:14px;display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font:var(--fw-semibold) var(--fs-12)/17px var(--font-bold);color:var(--text-strong)\">Shell · lo que está siempre<\u002Fspan>\n            <sc-for list=\"{{ shell }}\" as=\"s\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;gap:10px;font:var(--fw-regular) var(--fs-13)/19px var(--font-default);color:var(--text-body)\"><span style=\"flex:0 0 140px;color:var(--text-strong);font-weight:var(--fw-semibold)\">{{ s.k }}<\u002Fspan><span>{{ s.v }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border-subtle);border-radius:var(--radius-4);padding:14px;display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font:var(--fw-semibold) var(--fs-12)/17px var(--font-bold);color:var(--text-strong)\">Patrón de navegación de artefacto · idéntico para los 11 tipos<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;row-gap:6px;gap:6px\">\n              <sc-for list=\"{{ artifactNav }}\" as=\"a\" hint-placeholder-count=\"7\">\n                <span style=\"border:1px solid var(--border-default);border-radius:var(--radius-4);padding:4px 9px;font:var(--fw-regular) var(--fs-12)/16px var(--font-default);color:var(--text-body);background:var(--white)\">{{ a }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <span style=\"font:var(--fw-regular) var(--fs-12)/17px var(--font-default);color:var(--text-secondary);text-wrap:pretty\">Lista → Detalle (con estas pestañas) → Editor del borrador. La URL siempre lleva tipo, ID y versión: <code style=\"font-family:ui-monospace,monospace;font-size:var(--fs-11)\">/workflows/residential-sale/v7<\u002Fcode>. Una versión publicada abre en solo lectura con «Crear nueva versión» como única acción de escritura.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 03 · TAXONOMÍA -->\n      <section id=\"taxonomia\" style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-8);box-shadow:var(--shadow-1);padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font:var(--fw-semibold) var(--fs-10)/16px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary)\">03 · Fase 1 · Taxonomía de artefactos<\u002Fspan>\n          <h2 style=\"margin:0;font:var(--fw-semibold) var(--fs-24)/32px var(--font-bold);letter-spacing:var(--ls-tighter);color:var(--text-strong)\">Once tipos, tres familias, un dueño por tipo<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;max-width:80ch;font:var(--fw-regular) var(--fs-14)/22px var(--font-default);color:var(--text-body);text-wrap:pretty\">El dueño importa: ARCHITECTURE §6 asigna cada artefacto a un servicio y el BFF solo compone. La UI debe saber quién publica para mostrar el evento correcto y para no prometer ediciones que el owner no expone.<\u002Fp>\n        <div style=\"overflow-x:auto\">\n          <div style=\"min-width:720px;display:grid;grid-template-columns:160px 110px 1fr 150px 190px;gap:0 12px;font:var(--fw-semibold) var(--fs-10)/14px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary);padding:6px 0;border-bottom:1px solid var(--border-subtle)\">\n            <span>Artefacto<\u002Fspan><span>Familia<\u002Fspan><span>Qué define · campos del dominio<\u002Fspan><span>Owner<\u002Fspan><span>Evento al publicar<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ taxonomy }}\" as=\"t\" hint-placeholder-count=\"11\">\n            <div style=\"min-width:720px;display:grid;grid-template-columns:160px 110px 1fr 150px 190px;gap:0 12px;padding:9px 0;border-bottom:1px solid var(--border-subtle);align-items:start\">\n              <span style=\"font:var(--fw-semibold) var(--fs-13)/18px var(--font-bold);color:var(--text-strong)\">{{ t.n }}<\u002Fspan>\n              <span style=\"{{ t.famStyle }}\">{{ t.fam }}<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-12)/17px var(--font-default);color:var(--text-body);text-wrap:pretty\">{{ t.d }}<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary);font-family:ui-monospace,monospace\">{{ t.owner }}<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary);font-family:ui-monospace,monospace\">{{ t.ev }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 04 · PERSONAS Y PERMISOS -->\n      <section id=\"personas\" style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-8);box-shadow:var(--shadow-1);padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font:var(--fw-semibold) var(--fs-10)/16px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary)\">04 · Fase 1 · Personas y permisos<\u002Fspan>\n          <h2 style=\"margin:0;font:var(--fw-semibold) var(--fs-24)/32px var(--font-bold);letter-spacing:var(--ls-tighter);color:var(--text-strong)\">Cinco personas internas, ocho permisos<\u002Fh2>\n        <\u002Fdiv>\n        <x-import component-from-global-scope=\"BrickDesignSystem_6e25e4.Alert\" variant=\"info\" title=\"Supuesto de diseño\" hint-size=\"100%,auto\">El dominio no define roles internos de plataforma; ARCHITECTURE §4 dice solo «equipo interno de producto/plataforma» y W3-PLT-01 pide «permisos backoffice/auditoría». Las personas y permisos de abajo son una propuesta para que <code>access-service<\u002Fcode> los formalice. La UX que sí es regla: <strong>una acción bloqueada dice por qué<\u002Fstrong> («Podés ver pero no publicar: requiere PUBLISH en Comisiones»).<\u002Fx-import>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px\">\n          <sc-for list=\"{{ personas }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"border:1px solid var(--border-subtle);border-radius:var(--radius-4);padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface-page)\">\n              <x-import component-from-global-scope=\"BrickDesignSystem_6e25e4.Avatar\" text=\"{{ p.n }}\" size=\"{{ 32 }}\" variant=\"circle\" hint-size=\"32px,32px\"><\u002Fx-import>\n              <span style=\"font:var(--fw-semibold) var(--fs-14)/19px var(--font-bold);color:var(--text-strong)\">{{ p.n }}<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-12)/17px var(--font-default);color:var(--text-body);text-wrap:pretty\">{{ p.d }}<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary)\">Vive en: {{ p.home }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"overflow-x:auto\">\n          <div style=\"min-width:640px;display:grid;grid-template-columns:170px repeat(5,1fr);gap:0 8px;font:var(--fw-semibold) var(--fs-10)/14px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary);padding:6px 0;border-bottom:1px solid var(--border-subtle)\">\n            <span>Permiso<\u002Fspan><span>Configurador<\u002Fspan><span>Release<\u002Fspan><span>Compliance<\u002Fspan><span>Soporte<\u002Fspan><span>Admin plat.<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ perms }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div style=\"min-width:640px;display:grid;grid-template-columns:170px repeat(5,1fr);gap:0 8px;padding:8px 0;border-bottom:1px solid var(--border-subtle);align-items:center\">\n              <span style=\"font:var(--fw-semibold) var(--fs-12)/17px var(--font-bold);color:var(--text-strong);font-family:ui-monospace,monospace\">{{ r.k }}<\u002Fspan>\n              <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"5\">\n                <span style=\"{{ c.style }}\">{{ c.v }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 05 · MODELO DE CONFIGURACIÓN -->\n      <section id=\"modelo\" style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-8);box-shadow:var(--shadow-1);padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font:var(--fw-semibold) var(--fs-10)/16px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary)\">05 · Fase 2 · Modelo de configuración<\u002Fspan>\n          <h2 style=\"margin:0;font:var(--fw-semibold) var(--fs-24)/32px var(--font-bold);letter-spacing:var(--ls-tighter);color:var(--text-strong)\">Del pack a la configuración efectiva<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;max-width:80ch;font:var(--fw-regular) var(--fs-14)/22px var(--font-default);color:var(--text-body);text-wrap:pretty\">Cinco capas. Las tres de arriba se editan acá; la cuarta la edita la inmobiliaria en su CRM (COMI-001/002, ORG-005/006, CAT-001…); la quinta no la edita nadie: se <strong>resuelve<\u002Fstrong>. El inspector de configuración efectiva es la pantalla que hace observable esa resolución.<\u002Fp>\n\n        <div style=\"display:flex;flex-direction:column;gap:0\">\n          <sc-for list=\"{{ layers }}\" as=\"l\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr);gap:0\">\n              <div style=\"display:flex;flex-wrap:wrap;row-gap:6px;gap:12px;align-items:stretch;border:1px solid var(--border-subtle);border-radius:var(--radius-4);overflow:hidden\">\n                <div style=\"flex:0 0 160px;padding:14px;background:{{ l.bg }};color:{{ l.fg }};display:flex;flex-direction:column;gap:3px\">\n                  <span style=\"font:var(--fw-semibold) var(--fs-10)/14px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;opacity:.75\">Capa {{ l.n }}<\u002Fspan>\n                  <span style=\"font:var(--fw-semibold) var(--fs-15)/20px var(--font-bold)\">{{ l.t }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"flex:1 1 300px;min-width:0;padding:12px 14px 12px 0;display:flex;flex-direction:column;gap:5px\">\n                  <span style=\"font:var(--fw-regular) var(--fs-13)/19px var(--font-default);color:var(--text-body);text-wrap:pretty\">{{ l.d }}<\u002Fspan>\n                  <div style=\"display:flex;flex-wrap:wrap;row-gap:6px;gap:6px 14px\">\n                    <span style=\"font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary)\">Quién edita: <strong style=\"color:var(--text-strong)\">{{ l.who }}<\u002Fstrong><\u002Fspan>\n                    <span style=\"font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary)\">Ejemplo: <span style=\"font-family:ui-monospace,monospace\">{{ l.ex }}<\u002Fspan><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ l.arrow }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;align-items:center;gap:8px;padding:4px 0 4px 72px;font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary)\">\n                  <span style=\"width:2px;height:14px;background:var(--border-default)\"><\u002Fspan>{{ l.arrowLabel }}\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px\">\n          <div style=\"border:1px solid var(--border-subtle);border-radius:var(--radius-4);overflow:hidden\">\n            <div style=\"padding:10px 14px;background:var(--grey-20);font:var(--fw-semibold) var(--fs-12)/17px var(--font-bold);color:var(--text-strong)\">Composición de un pack · referencias, no copias<\u002Fdiv>\n            <pre style=\"margin:0;padding:14px;font:var(--fw-regular) var(--fs-12)/18px ui-monospace,monospace;color:var(--text-body);white-space:pre;overflow-x:auto\">{{ packTree }}<\u002Fpre>\n            <div style=\"padding:10px 14px;border-top:1px solid var(--border-subtle);font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary)\">Cada línea es un puntero a una versión publicada de un artefacto ajeno. El pack no puede apuntar a un borrador: es un bloqueo de validación.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border-subtle);border-radius:var(--radius-4);overflow:hidden\">\n            <div style=\"padding:10px 14px;background:var(--grey-20);font:var(--fw-semibold) var(--fs-12)/17px var(--font-bold);color:var(--text-strong)\">Resolución para un tenant · lo que muestra el inspector<\u002Fdiv>\n            <pre style=\"margin:0;padding:14px;font:var(--fw-regular) var(--fs-12)/18px ui-monospace,monospace;color:var(--text-body);white-space:pre;overflow-x:auto\">{{ resolveTree }}<\u002Fpre>\n            <div style=\"padding:10px 14px;border-top:1px solid var(--border-subtle);font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary)\">Las operaciones ya creadas no se ven afectadas: conservan <span style=\"font-family:ui-monospace,monospace\">appliedPackVersion<\u002Fspan> / <span style=\"font-family:ui-monospace,monospace\">policyVersion<\u002Fspan> (README §4.5, §11).<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid var(--border-subtle);border-radius:var(--radius-4);padding:14px;display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font:var(--fw-semibold) var(--fs-12)/17px var(--font-bold);color:var(--text-strong)\">Ciclo de vida de una versión · el mismo para los 11 tipos<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;row-gap:6px;gap:8px;align-items:center\">\n            <sc-for list=\"{{ lifecycle }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <span style=\"{{ s.style }}\">{{ s.t }}<\u002Fspan>\n                <sc-if value=\"{{ s.next }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:var(--text-secondary)\">→<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px\">\n            <sc-for list=\"{{ lifecycleRules }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <span style=\"font:var(--fw-regular) var(--fs-12)/18px var(--font-default);color:var(--text-body);text-wrap:pretty\"><strong style=\"color:var(--text-strong)\">{{ r.k }}<\u002Fstrong> {{ r.v }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid var(--border-subtle);border-radius:var(--radius-4);padding:14px;display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font:var(--fw-semibold) var(--fs-12)/17px var(--font-bold);color:var(--text-strong)\">Dos estados que no hay que confundir<\u002Fspan>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font:var(--fw-semibold) var(--fs-11)/15px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary)\">Estado de la versión del artefacto<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-13)/19px var(--font-default);color:var(--text-body)\">DRAFT · PUBLISHED · DEPRECATED. Es global, lo maneja Platform Admin, y responde «¿esta definición está lista para usarse?».<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font:var(--fw-semibold) var(--fs-11)/15px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary)\">Estado de una capability en una organización<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-13)/19px var(--font-default);color:var(--text-body)\">DISABLED · ENABLED · PILOT · RESTRICTED (README §4.5). Es por tenant y responde «¿esta inmobiliaria la tiene?». <strong>PILOT es el mecanismo de piloto que el dominio ya trae<\u002Fstrong>: el módulo Pilotos lo administra, no inventa otro.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 06 · INVENTARIO -->\n      <section id=\"inventario\" style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-8);box-shadow:var(--shadow-1);padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-wrap:wrap;row-gap:6px;gap:12px;align-items:flex-end;justify-content:space-between\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font:var(--fw-semibold) var(--fs-10)/16px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary)\">06 · Fase 3 · Screen inventory<\u002Fspan>\n            <h2 style=\"margin:0;font:var(--fw-semibold) var(--fs-24)/32px var(--font-bold);letter-spacing:var(--ls-tighter);color:var(--text-strong)\">{{ shownCount }}<\u002Fh2>\n            <span style=\"font:var(--fw-regular) var(--fs-13)/18px var(--font-default);color:var(--text-secondary)\">{{ countNote }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;row-gap:6px;gap:8px;align-items:center\">\n            <input value=\"{{ q }}\" sc-camel-on-input=\"{{ onQuery }}\" placeholder=\"Buscar pantalla, artefacto, UC…\" style=\"height:34px;padding:0 11px;border:1px solid var(--border-default);border-radius:var(--radius-4);font:var(--fw-regular) var(--fs-13)/18px var(--font-default);color:var(--text-strong);min-width:240px;background:var(--white)\">\n            <div style=\"display:flex;gap:4px\">\n              <sc-for list=\"{{ waveTabs }}\" as=\"w\" hint-placeholder-count=\"4\">\n                <button type=\"button\" sc-camel-on-click=\"{{ w.on }}\" style=\"{{ w.style }}\">{{ w.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;row-gap:6px;gap:6px\">\n          <sc-for list=\"{{ modChips }}\" as=\"m\" hint-placeholder-count=\"10\">\n            <button type=\"button\" sc-camel-on-click=\"{{ m.on }}\" style=\"{{ m.style }}\">{{ m.label }} <span style=\"opacity:.7\">{{ m.n }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"overflow-x:auto;border:1px solid var(--border-subtle);border-radius:var(--radius-4)\">\n          <div style=\"min-width:1180px;display:grid;grid-template-columns:76px 190px 170px 1fr 120px 1fr 150px 130px 60px;gap:0 10px;padding:8px 12px;background:var(--grey-20);font:var(--fw-semibold) var(--fs-
