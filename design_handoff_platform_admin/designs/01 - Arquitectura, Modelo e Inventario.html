 style=\"color:var(--text-body)\">Desde:<\u002Fstrong> {{ r.entry }}<\u002Fspan><span><strong style=\"color:var(--text-body)\">Estados:<\u002Fstrong> {{ r.states }}<\u002Fspan><span><strong style=\"color:var(--text-body)\">Depende de:<\u002Fstrong> {{ r.deps }}<\u002Fspan><\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-body);font-family:ui-monospace,monospace;text-wrap:pretty\">{{ r.artifact }}<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary);font-family:ui-monospace,monospace\">{{ r.uc }}<\u002Fspan>\n              <span style=\"{{ r.waveStyle }}\">{{ r.wave }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:24px;text-align:center;font:var(--fw-regular) var(--fs-13)/18px var(--font-default);color:var(--text-secondary)\">Ninguna pantalla coincide. <button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"border:0;background:none;color:var(--text-link);cursor:pointer;font:inherit;text-decoration:underline\">Limpiar filtros<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 07 · TRAZABILIDAD -->\n      <section id=\"trazabilidad\" style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-8);box-shadow:var(--shadow-1);padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font:var(--fw-semibold) var(--fs-10)/16px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary)\">07 · Trazabilidad PLT-001 → PLT-020 + superficies de otros contextos<\u002Fspan>\n          <h2 style=\"margin:0;font:var(--fw-semibold) var(--fs-24)/32px var(--font-bold);letter-spacing:var(--ls-tighter);color:var(--text-strong)\">Cada caso de uso tiene pantalla, acción y componente<\u002Fh2>\n        <\u002Fdiv>\n        <x-import component-from-global-scope=\"BrickDesignSystem_6e25e4.Alert\" variant=\"warning\" title=\"Diez UCs sin texto en el repositorio\" hint-size=\"100%,auto\">Las tasks de la ola 7 y W5-PLT-01 listan los IDs PLT-002, 003, 005, 007, 008, 015, 016, 017, 018 y 020 pero no describen el caso. El significado de abajo se infiere del título de la task y queda marcado <strong>inferido<\u002Fstrong>; hay que confirmarlo contra el catálogo de 274 UCs antes de hi-fi.<\u002Fx-import>\n        <div style=\"overflow-x:auto\">\n          <div style=\"min-width:820px;display:grid;grid-template-columns:76px 1fr 130px 1fr 1fr 60px;gap:0 12px;font:var(--fw-semibold) var(--fs-10)/14px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary);padding:6px 0;border-bottom:1px solid var(--border-subtle)\">\n            <span>UC<\u002Fspan><span>Caso<\u002Fspan><span>Pantallas<\u002Fspan><span>Acción<\u002Fspan><span>Componentes clave<\u002Fspan><span>Task<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ trace }}\" as=\"t\" hint-placeholder-count=\"20\">\n            <div style=\"min-width:820px;display:grid;grid-template-columns:76px 1fr 130px 1fr 1fr 60px;gap:0 12px;padding:8px 0;border-bottom:1px solid var(--border-subtle);align-items:start\">\n              <span style=\"font:var(--fw-semibold) var(--fs-11)/16px var(--font-bold);color:var(--eminent-primary);font-family:ui-monospace,monospace\">{{ t.uc }}<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-12)/17px var(--font-default);color:var(--text-body);text-wrap:pretty\">{{ t.c }} <sc-if value=\"{{ t.inf }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font:var(--fw-semibold) var(--fs-10)/14px var(--font-bold);color:var(--state-warning);background:var(--state-warning-light);border-radius:3px;padding:1px 5px\">inferido<\u002Fspan><\u002Fsc-if><\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--eminent-primary);font-family:ui-monospace,monospace\">{{ t.s }}<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-12)/17px var(--font-default);color:var(--text-body);text-wrap:pretty\">{{ t.a }}<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary);text-wrap:pretty\">{{ t.k }}<\u002Fspan>\n              <span style=\"font:var(--fw-regular) var(--fs-11)/16px var(--font-default);color:var(--text-secondary);font-family:ui-monospace,monospace\">{{ t.task }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 08 · SUPUESTOS Y PREGUNTAS -->\n      <section id=\"supuestos\" style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-8);box-shadow:var(--shadow-1);padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font:var(--fw-semibold) var(--fs-10)/16px var(--font-bold);letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--text-secondary)\">08 · Supuestos de diseño y preguntas de producto<\u002Fspan>\n          <h2 style=\"margin:0;font:var(--fw-semibold) var(--fs-24)/32px var(--font-bold);letter-spacing:var(--ls-tighter);color:var(--text-strong)\">Qué asumí y qué necesito que decidas<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font:var(--fw-semibold) var(--fs-14)/20px var(--font-bold);color:var(--text-strong)\">Supuestos de diseño <span style=\"color:var(--text-secondary);font-weight:var(--fw-regular)\">— aplicados, revisables<\u002Fspan><\u002Fspan>\n            <sc-for list=\"{{ assumptions }}\" as=\"a\" hint-placeholder-count=\"8\">\n              <div style=\"border:1px solid var(--border-subtle);border-radius:var(--radius-4);padding:10px 12px;display:flex;flex-direction:column;gap:3px\">\n                <span style=\"font:var(--fw-semibold) var(--fs-12)/16px var(--font-bold);color:var(--text-strong)\">{{ a.id }}<\u002Fspan>\n                <span style=\"font:var(--fw-regular) var(--fs-13)/19px var(--font-default);color:var(--text-body);text-wrap:pretty\">{{ a.t }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font:var(--fw-semibold) var(--fs-14)/20px var(--font-bold);color:var(--text-strong)\">Preguntas de producto <span style=\"color:var(--text-secondary);font-weight:var(--fw-regular)\">— bloquean partes del hi-fi<\u002Fspan><\u002Fspan>\n            <sc-for list=\"{{ questions }}\" as=\"q2\" hint-placeholder-count=\"6\">\n              <div style=\"border:1px solid var(--state-warning);border-left:3px solid var(--state-warning);border-radius:var(--radius-4);padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:var(--state-warning-light)\">\n                <span style=\"font:var(--fw-semibold) var(--fs-12)/16px var(--font-bold);color:var(--text-strong)\">{{ q2.id }} · bloquea {{ q2.blocks }}<\u002Fspan>\n                <span style=\"font:var(--fw-regular) var(--fs-13)/19px var(--font-default);color:var(--text-body);text-wrap:pretty\">{{ q2.t }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst MODS = [\n  ['OVW', 'Overview'], ['PCK', 'Packs'], ['CAP', 'Capabilities'], ['CAT', 'Catálogo
