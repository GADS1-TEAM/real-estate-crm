name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  fast:
    name: Build + tests (sin infra) + build de webs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build + test rápido + build de webs
        run: bash scripts/test-fast.sh

      - name: Validar configuración del alojamiento
        run: |
          docker compose --env-file .env.hosted.example -f docker-compose.hosted.yml config --quiet
          node --check scripts/render-hosted-realm.mjs

  integration:
    name: Tests de integración (Mongo/RabbitMQ/Keycloak reales)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Compose up + tests de integración
        run: bash scripts/test-integration.sh
